## ------------------------------------------- Driving License Integration properties ------------------------------------------------------------
mosip.certify.integration.scan-base-package=io.mosip.certify.mock.integration
mosip.certify.integration.audit-plugin=LoggerAuditService
mosip.certify.integration.vci-plugin=MockVCIssuancePlugin

## ------------------------------------------- Driving License plugin related properties ------------------------------------------------------------
mosip.certify.mock.vciplugin.verification-method=${mosip.certify.authn.jwk-set-uri}
# The mock identity service is not needed for CSV, but you can still leave it for testing
mosip.certify.mock.authenticator.get-identity-url=http://mock-identity-system:8082/v1/mock-identity-system/identity

mosip.certify.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.certify.cache.secure.individual-id=false
mosip.certify.cache.store.individual-id=true
mosip.certify.identifier=${mosip.certify.domain.url}

# Driving License specific Data Provider Plugin
mosip.certify.data-provider-plugin.did-url=did:web:example.com:driving-license:vc-ed25519
mosip.certify.plugin-mode=DataProvider
mosip.certify.integration.data-provider-plugin=MockCSVDataProviderPlugin

# CSV specific configuration
mosip.certify.mock.data-provider.csv.identifier-column=licenseNumber
mosip.certify.mock.data-provider.csv.data-columns=licenseNumber,fullName,dateOfBirth,address,issueDate,expiryDate,bloodGroup,vehicleType
mosip.certify.mock.data-provider.csv-registry-uri=/home/mosip/config/driving_license_data.csv

# Credential rendering template (optional if you have custom VC HTML)
mosip.certify.data-provider-plugin.rendering-template-id=driving-license-template

# Issuer details (displayed in wallet)
mosip.certify.credential-config.issuer.display={\
  {\
    'name': 'Driving License Authority',\
    'locale': 'en'\
  }\
}

# Cryptographic settings for signing VC
mosip.certify.status-list.signature-crypto-suite=Ed25519Signature2020
